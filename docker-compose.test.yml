version: '3.8'

services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    container_name: mcmca-playwright-e2e
    environment:
      - CI=true
      - BASE_URL=http://localhost:5173
    ports:
      - "5173:5173"
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    command: >
      sh -c "npm run build && (npx vite preview --port 5173 --host 0.0.0.0 &) && npx wait-on http://localhost:5173 && npx playwright test"
